<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CEF</title>
    <!-- Importações do seu sistema -->
    <link rel="stylesheet" href="src/styles/reset.css">
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/layout.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/auth.css">
</head>
<body class="auth-body">

    <main class="auth-card">
        
        <header class="auth-header">
            <h1 class="auth-title">Entrar</h1>
            <p class="auth-subtitle">Acesse o sistema CEF</p>
        </header>
        
        <form id="login-form" class="form">
            
            <div class="field">
                <label for="email" class="field__label">E-mail</label>
                <input type="email" id="email" class="input" placeholder="seu@email.com">
            </div>
            
            <div class="field">
                <label for="password" class="field__label">Senha</label>
                <input type="password" id="password" class="input" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn--primary btn--block">
                Acessar Sistema
            </button>
            
        </form>

        <div class="auth-links">
            <a href="recuperar-senha.html" class="auth-link">Esqueci minha senha</a>
        </div>
        
    </main>

    <script src="src/js/ui/views/login-view.js" type="module"></script>
</body>
</html>
