<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - CEF</title>
    <link rel="stylesheet" href="src/styles/reset.css">
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/layout.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/auth.css">
</head>
<body class="auth-body">

    <main class="auth-card">
        
        <header class="auth-header">
            <h1 class="auth-title">Recuperar Senha</h1>
            <p class="auth-subtitle">Digite seu e-mail para receber um link.</p>
        </header>
        
        <form id="recover-form" class="form">
            
            <div class="field">
                <label for="email" class="field__label">E-mail</label>
                <input type="email" id="email" class="input" placeholder="seu@email.com">
            </div>
            
            <button type="submit" class="btn btn--primary btn--block">
                Enviar instruções
            </button>
            
        </form>

        <div class="auth-links">
            <a href="login.html" class="auth-link">Voltar para o login</a>
        </div>
        
    </main>

    <script src="src/js/ui/views/recover-view.js" type="module"></script>
</body>
</html>
